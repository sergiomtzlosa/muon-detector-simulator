name: MuonDetectorSimulator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "27.0"

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/../Frameworks"

targets:
  MuonDetectorSimulator:
    type: application
    platform: macOS
    sources:
      - path: MuonDetectorSimulator/App
      - path: MuonDetectorSimulator/Models
      - path: MuonDetectorSimulator/Simulation
      - path: MuonDetectorSimulator/Scene
      - path: MuonDetectorSimulator/UI
      - path: MuonDetectorSimulator/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Muon Detector Simulator
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MuonDetectorSimulator
        INFOPLIST_FILE: MuonDetectorSimulator/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

  MuonDetectorSimulatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MuonDetectorSimulatorTests
      - path: MuonDetectorSimulator/Models
      - path: MuonDetectorSimulator/Simulation
      - path: MuonDetectorSimulator/UI/MDSLogEntry.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MuonDetectorSimulatorTests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/MuonDetectorSimulator/Models"
          - "$(SRCROOT)/MuonDetectorSimulator/Simulation"
          - "$(SRCROOT)/MuonDetectorSimulator/UI"
        CLANG_ENABLE_OBJC_ARC: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - sdk: XCTest.framework

schemes:
  MuonDetectorSimulator:
    build:
      targets:
        MuonDetectorSimulator: all
        MuonDetectorSimulatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MuonDetectorSimulatorTests
    archive:
      config: Release







