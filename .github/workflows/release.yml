name: Build and Release Xcode Binary

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v1.0.0

permissions:
  contents: write # Required to create releases and upload assets

env:
  PROJECT_NAME: MuonDetectorSimulator.xcodeproj
  SCHEME: MuonDetectorSimulator
  APP_NAME: Muon Detector Simulator
  CONFIGURATION: Release

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and regenerate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataRelease \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app binary and source archive
        run: |
          PRODUCTS_DIR="build/DerivedDataRelease/Build/Products/$CONFIGURATION"

          # The app bundle is named by PRODUCT_NAME in project.yml
          # ("Muon Detector Simulator"), not by the scheme name, so resolve
          # it from the products directory instead of hardcoding it.
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in $PRODUCTS_DIR"
            exit 1
          fi
          echo "Packaging $APP_PATH"

          VERSION="${GITHUB_REF_NAME#v}"

          # 1. Zip the compiled .app bundle
          ditto -c -k --keepParent "$APP_PATH" "$APP_NAME-$VERSION-macos.zip"

          # 2. Create a clean source code .tar.gz from Git HEAD
          git archive --format=tar.gz --prefix="$APP_NAME-$VERSION/" -o "$APP_NAME-$VERSION-source.tar.gz" HEAD

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-*-macos.zip
            ${{ env.APP_NAME }}-*-source.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
